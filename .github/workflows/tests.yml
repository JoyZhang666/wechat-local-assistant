name: Synthetic Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-gui.txt -r requirements-membership.txt -r requirements-voice.txt -r requirements-asr.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/build_public_source.py --check
