<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="t d"><title id="t">微信本地助手：主题摘要输出结构示意</title><desc id="d">全部使用虚构内容。选择范围，按主题整理待办和未解决问题，并附原文引用。</desc><rect width="1120" height="600" rx="16" fill="#f3f5f8"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="44" y="52" font-size="14" fill="#245ad3">微信本地助手 · 输出结构示意 · 虚构内容</text><text x="44" y="96" font-size="28" font-weight="700" fill="#17263c">从一段讨论，到一份可行动的资料</text><rect x="40" y="126" width="1040" height="434" rx="12" fill="#fff" stroke="#cad4e1"/><text x="66" y="166" font-size="21" font-weight="700" fill="#17263c">产品讨论组 · 主题摘要</text><text x="66" y="196" font-size="14" fill="#53647a">范围明确 · 按主题阅读 · 可回查原文</text><rect x="66" y="218" width="988" height="44" rx="4" fill="#edf3ff"/><g font-size="15" font-weight="700" fill="#254a86"><text x="82" y="246">主题</text><text x="320" y="246">待办事项</text><text x="570" y="246">未解决问题</text><text x="820" y="246">关注点</text></g><g font-size="15" fill="#17263c"><text x="82" y="292">演示准备</text><text x="320" y="292">周三确认负责人</text><text x="570" y="292">预算尚待审批</text><text x="820" y="292">不要把提议当决定</text></g><path d="M66 312H1054" stroke="#d8e1ed"/><text x="66" y="354" font-size="20" font-weight="700" fill="#17263c">明确决定与待办</text><text x="66" y="388" font-size="17" fill="#17263c">演示计划保留；预算尚未批准，采购安排等待周三确认。</text><rect x="66" y="414" width="4" height="58" fill="#bdcbdf"/><text x="88" y="438" font-size="14" fill="#66758a">依据：M000012</text><text x="88" y="463" font-size="14" fill="#66758a">“预算先不要定，等周三审批结果。”</text><text x="66" y="518" font-size="14" fill="#53647a">完整记录包：HTML 阅读页 + Markdown + 结构化记录 + 可恢复媒体</text></g></svg>
