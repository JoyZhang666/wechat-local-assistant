name: Synthetic Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-gui.txt -r requirements-membership.txt -r requirements-voice.txt -r requirements-asr.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/build_public_source.py --check
